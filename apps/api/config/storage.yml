test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 is S3-compatible (ADR 0006). It needs an explicit endpoint and
# `force_path_style` off; region is fixed to "auto" for R2. Credentials come
# from ENV so nothing sensitive lives in the repo. Swappable for any other
# S3-compatible service by changing these values alone.
cloudflare:
  service: S3
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  # Recent aws-sdk-s3 defaults to sending an extra trailing checksum header
  # that R2's S3-compatible API rejects ("You can only specify one non-default
  # checksum at a time"). Forcing the legacy behavior fixes uploads against R2.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
