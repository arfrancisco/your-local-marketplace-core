<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisma KapitMarket — By the community, for the community</title>
    <meta name="description" content="Order food and goods from your neighbors — pickup or delivery, all within your own building cluster." />

    <!-- Open Graph / Twitter Card defaults for the landing page and as a
         fallback for any page a crawler fetches directly. Shop pages get
         their own shop-specific values instead — see StaticController and
         SocialPreviews:: services in apps/api, which serve social-media
         crawlers (Facebook/Instagram, Twitter/X, LinkedIn, Slack, Discord,
         WhatsApp, Telegram, etc.) a version of this shell with these tags
         swapped for the shop being shared, since those crawlers fetch the
         URL once without running JavaScript and would otherwise only ever
         see these same defaults regardless of which shop was linked.
         Absolute URLs are required by the Open Graph spec — hardcoded to
         the production domain since this file is static at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prisma KapitMarket" />
    <meta property="og:title" content="Prisma KapitMarket — By the community, for the community" />
    <meta property="og:description" content="Order food and goods from your neighbors — pickup or delivery, all within your own building cluster." />
    <meta property="og:image" content="https://prisma.kapitmarket.ph/bazaar.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:url" content="https://prisma.kapitmarket.ph/shops" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prisma KapitMarket — By the community, for the community" />
    <meta name="twitter:description" content="Order food and goods from your neighbors — pickup or delivery, all within your own building cluster." />
    <meta name="twitter:image" content="https://prisma.kapitmarket.ph/bazaar.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
